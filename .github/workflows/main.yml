# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages
#
# Actions use Node.js 24 runtimes (actions/*@v6+ / @v7) — see GitHub changelog 2025-09-19.

name: Main CI

env:
  GITHUB_TOKEN: ${{ github.token }}
  HUSKY: 0
  SKIP_ENV_VALIDATION: true
  PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need to fetch entire commit history to
          # analyze every commit since last release
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Init workspace (postinstall)
        run: pnpm run ci:init

      - name: Run tests
        run: pnpm run test:ci

      - name: Build Project
        run: pnpm build

      - name: ES Guard
        run: pnpm exec es-guard --skip

      - name: Run Semantic Release
        run: npx semantic-release
